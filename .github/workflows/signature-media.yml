# alicanercan.com (WordPress) medya kütüphanesindeki Caner'e ait görselleri indirip depoya koyar.
# signature/media-sources.txt değiştiğinde ya da elle çalıştırılınca çalışır.
name: Signature medya indir

on:
  push:
    branches: [main]
    paths: ['signature/media-sources.txt', '.github/workflows/signature-media.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Görselleri indir
        run: |
          mkdir -p signature/media/orig
          ok=0; fail=0
          while read -r u; do
            [ -z "$u" ] && continue
            f="signature/media/orig/$(echo "$u" | sed -E 's#.*/uploads/([0-9]{4})/([0-9]{2})/#\1-\2-#')"
            if curl -fsSL -A "Mozilla/5.0" "$u" -o "$f"; then ok=$((ok+1)); else rm -f "$f"; fail=$((fail+1)); echo "YOK: $u"; fi
          done < signature/media-sources.txt
          echo "indirilen=$ok bulunamayan=$fail"
          ls -la signature/media/orig | head -80
      - name: Depoya kaydet
        run: |
          git config user.name "acc-bot"
          git config user.email "acc-bot@users.noreply.github.com"
          git add signature/media
          git diff --cached --quiet || git commit -m "Signature: alicanercan.com görselleri indirildi"
          git push
