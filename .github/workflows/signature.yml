# alicanercan.com (Ali Caner Can signature sitesi): derleyip Turhost'taki public_html'e yükler.
# Gizli ayarlar: SIG_FTP_SERVER, SIG_FTP_USERNAME, SIG_FTP_PASSWORD (22.11.2026 girildi)
# WordPress dosyaları silinmez; .htaccess "DirectoryIndex index.html" ile yeni site öne geçer.
name: Signature yayını

on:
  push:
    branches: [main]
    paths: ['signature/**', '!signature/media/**', '!signature/media-sources.txt', '.github/workflows/signature.yml', 'data/reviews.json', 'data/site.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signature-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.SIG_FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Siteyi derle
        run: node signature/build.mjs
        env:
          FORCE_HTTPS: "1"
      - name: alicanercan.com'a yükle
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SIG_FTP_SERVER }}
          username: ${{ secrets.SIG_FTP_USERNAME }}
          password: ${{ secrets.SIG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./signature/dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-signature.json
          exclude: |
            **/.git*
            **/.git*/**
