# Canlı site: her güncellemede siteyi derleyip Turhost'a (acchomesantalya.com) yükler.
# Gerekli GitHub gizli ayarları (Settings > Secrets and variables > Actions):
#   FTP_SERVER   (örn. ftp.acchomesantalya.com)
#   FTP_USERNAME (cPanel'de yalnızca bu iş için açılan FTP hesabı)
#   FTP_PASSWORD
# Gizli ayarlar girilmeden iş akışı yalnızca derleme yapar, yükleme yapmaz.
name: Turhost yayını

on:
  push:
    branches: [main]
    paths-ignore: ['signature/**', 'altintas/**', '.github/workflows/altintas.yml', '.github/workflows/signature-media.yml', '.github/workflows/signature.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turhost-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SITE_HOST: turhost
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Görsel küçültme aracı (sharp)
        run: npm install --no-save --no-package-lock sharp@0.33 @fontsource/montserrat@5 @fontsource/vazirmatn@5
      - name: Siteyi derle
        run: node build.mjs
      - name: Panel anlık görüntüsü (ilan SEO görevleri için)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: panel-snapshot
          path: panel-snapshot.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Panel anlık görüntüsünü panel-snapshot dalına yaz (artifact indirilemeyen oturumlar için)
        if: always()
        continue-on-error: true
        run: |
          [ -f panel-snapshot.json ] || exit 0
          tmp=$(mktemp -d) && cp panel-snapshot.json "$tmp/" && cd "$tmp"
          git init -q -b panel-snapshot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add panel-snapshot.json
          git commit -qm "Panel anlık görüntüsü $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" panel-snapshot:panel-snapshot
      - name: Yayındaki site haritasını sakla (IndexNow farkı için)
        if: env.FTP_SERVER != ''
        continue-on-error: true
        run: |
          curl -fsSL --max-time 30 https://acchomesantalya.com/sitemap.xml -o /tmp/old-sitemap.xml || : > /tmp/old-sitemap.xml
          curl -fsS --max-time 20 -o /dev/null https://acchomesantalya.com/bcba52b8a9ece55526718f8b01e80c0f.txt && echo yes > /tmp/indexnow-key-live || echo no > /tmp/indexnow-key-live
      - name: Turhost'a yükle
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            _redirects
      # Yeni sayfaları Bing, Yandex, Seznam ve Naver'e bildirir (Google IndexNow kullanmaz; site haritasından tarar).
      # Anahtar dosyası static/bcba52b8a9ece55526718f8b01e80c0f.txt silinmemeli. İlk kurulumda tüm site haritası, sonra yalnız yeni URL'ler gönderilir.
      - name: IndexNow (yeni sayfalar)
        if: env.FTP_SERVER != ''
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          rd = lambda p: set(re.findall(r'<loc>([^<]+)</loc>', open(p, encoding='utf8', errors='ignore').read()))
          new = rd('dist/sitemap.xml')
          try: old = rd('/tmp/old-sitemap.xml'); first = open('/tmp/indexnow-key-live').read().strip() != 'yes'
          except Exception: old, first = set(), False
          urls = sorted(new if first else (new - old if old else set()))[:10000]
          if not urls:
              print('IndexNow: yeni URL yok'); raise SystemExit
          key = 'bcba52b8a9ece55526718f8b01e80c0f'
          body = json.dumps({'host': 'acchomesantalya.com', 'key': key, 'keyLocation': f'https://acchomesantalya.com/{key}.txt', 'urlList': urls}).encode()
          for ep in ('https://api.indexnow.org/indexnow', 'https://yandex.com/indexnow'):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={'Content-Type': 'application/json; charset=utf-8'}), timeout=20)
                  print(ep, r.status, len(urls), 'URL')
              except Exception as e:
                  print(ep, 'hata:', e)
          PY
